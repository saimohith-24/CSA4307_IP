<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComplainEase | Grievance Redressal</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
  body { background: #f3f4f6; color: #111827; }
  header { background: #1e3a8a; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
  nav button { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 0.5rem 0.9rem; border-radius: 6px; cursor: pointer; margin-left: 0.4rem; }
  nav button.active { background: #3b82f6; }
  .container { max-width: 980px; margin: 2rem auto; padding: 0 1rem; }
  .card { background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
  input, select, textarea { width: 100%; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 0.7rem; }
  .btn { background: #1d4ed8; color: #fff; border: none; padding: 0.6rem 1.1rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .badge { padding: 0.25rem 0.6rem; border-radius: 99px; font-size: 0.8rem; font-weight: bold; }
  .Open { background: #fee2e2; color: #991b1b; }
  .Resolved { background: #dcfce7; color: #166534; }
  .panel { display: none; } .panel.active { display: block; }
</style>
</head>
<body>
<header>
  <h1>ComplainEase</h1>
  <nav>
    <button class="active" onclick="showPanel('citizen', this)">Citizen Desk</button>
    <button onclick="showPanel('officer', this)">Officer Portal</button>
    <button onclick="showPanel('admin', this)">Admin Control</button>
  </nav>
</header>
<div class="container">
  <div id="citizen" class="panel active">
    <div class="card">
      <h2>Register a Public Complaint</h2>
      <select id="cCat"><option>Streetlight Outage</option><option>Water Supply Leakage</option><option>Road Pothole Repair</option></select>
      <input id="cLoc" placeholder="Location / Landmark & Google Map Pin">
      <textarea id="cDesc" rows="3" placeholder="Describe the issue..."></textarea>
      <button class="btn" onclick="submitComplaint()">Submit Grievance</button>
    </div>
    <div class="card">
      <h3>Track Complaint Status</h3>
      <div id="citizenList"></div>
    </div>
  </div>

  <div id="officer" class="panel">
    <div class="card">
      <h2>Assigned Grievances (Field Officer)</h2>
      <div id="officerList"></div>
    </div>
  </div>

  <div id="admin" class="panel">
    <div class="card">
      <h2>Admin: Officer Credential & System Overview</h2>
      <p>Total Complaints Logged: <strong id="totalCount">0</strong></p>
      <div style="margin-top:1rem; display:flex; gap:0.5rem;">
        <input id="offName" placeholder="New Officer Name" style="margin:0;">
        <button class="btn" onclick="addOfficer()">Generate Officer ID</button>
      </div>
      <div id="officerAccounts" style="margin-top:1rem;"></div>
    </div>
  </div>
</div>
<script>
let complaints = [
  { id: "CMP-201", cat: "Streetlight Outage", loc: "Anna Nagar 2nd Ave", desc: "3 poles not working", status: "Open", proof: "Awaiting inspection" }
];
let officers = ["OFF-101 (R. Karthik - Ward 4)"];

function showPanel(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  render();
}

function submitComplaint() {
  const cat = document.getElementById('cCat').value;
  const loc = document.getElementById('cLoc').value.trim();
  const desc = document.getElementById('cDesc').value.trim();
  if(!loc || !desc) return alert("Enter location and description");
  complaints.unshift({ id: "CMP-" + (201 + complaints.length), cat, loc, desc, status: "Open", proof: "Assigned to Officer" });
  document.getElementById('cLoc').value = ""; document.getElementById('cDesc').value = "";
  render();
}

function resolveComplaint(i) {
  const proof = prompt("Enter resolution work proof note:", "Repaired & verified on site");
  if(proof) { complaints[i].status = "Resolved"; complaints[i].proof = proof; render(); }
}

function addOfficer() {
  const name = document.getElementById('offName').value.trim();
  if(!name) return;
  officers.push(`OFF-${101 + officers.length} (${name})`);
  document.getElementById('offName').value = "";
  render();
}

function render() {
  document.getElementById('totalCount').innerText = complaints.length;
  document.getElementById('citizenList').innerHTML = complaints.map(c => `
    <div style="border-bottom:1px solid #e5e7eb; padding:0.8rem 0;">
      <strong>${c.id} - ${c.cat}</strong> <span class="badge ${c.status}">${c.status}</span>
      <p style="font-size:0.9rem; color:#4b5563;">Location: ${c.loc} | ${c.desc}</p>
      <small>Officer Remark: ${c.proof}</small>
    </div>
  `).join('');
  document.getElementById('officerList').innerHTML = complaints.map((c, i) => `
    <div style="border-bottom:1px solid #e5e7eb; padding:0.8rem 0; display:flex; justify-content:space-between; align-items:center;">
      <div><strong>${c.id}: ${c.cat}</strong> (${c.loc})<br><small>${c.desc}</small></div>
      ${c.status === 'Open' ? `<button class="btn" onclick="resolveComplaint(${i})">Mark Resolved</button>` : '<span>✔ Done</span>'}
    </div>
  `).join('');
  document.getElementById('officerAccounts').innerHTML = officers.map(o => `<p>• ${o}</p>`).join('');
}
render();
</script>
</body>
</html>
