<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlossomGifts | Flowers & Hampers</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
  body { background: #fff1f2; color: #4c0519; }
  header { background: #be123c; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
  .container { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; }
  @media(max-width: 768px) { .container { grid-template-columns: 1fr; } }
  .card { background: #fff; padding: 1.2rem; border-radius: 12px; box-shadow: 0 4px 12px rgba(190,18,60,0.08); }
  .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; margin-top: 1rem; }
  .prod { border: 1px solid #fecdd3; border-radius: 10px; padding: 1rem; text-align: center; }
  .prod .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
  .btn { background: #e11d48; color: #fff; border: none; padding: 0.5rem 0.9rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .btn-alt { background: #ffe4e6; color: #be123c; }
  input, select { width: 100%; padding: 0.55rem; border: 1px solid #fda4af; border-radius: 6px; margin-bottom: 0.6rem; }
  .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ffe4e6; padding: 0.5rem 0; }
</style>
</head>
<body>
<header>
  <h1>BlossomGifts</h1>
  <div>
    <button class="btn btn-alt" onclick="toggleAdmin()">Admin Inventory</button>
  </div>
</header>
<div class="container">
  <div>
    <div class="card">
      <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
        <button class="btn" onclick="filterOcc('All')">All Gifts</button>
        <button class="btn btn-alt" onclick="filterOcc('Birthday')">Birthday</button>
        <button class="btn btn-alt" onclick="filterOcc('Anniversary')">Anniversary</button>
        <button class="btn btn-alt" onclick="filterOcc('Festive')">Festive Hampers</button>
      </div>
      <div class="products" id="prodList"></div>
    </div>

    <div class="card" id="adminBox" style="display:none; margin-top:1.5rem;">
      <h3>Admin: Add / Update Catalog</h3>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:0.5rem; margin-top:0.8rem;">
        <input id="newName" placeholder="Gift Name">
        <select id="newOcc"><option>Birthday</option><option>Anniversary</option><option>Festive</option></select>
        <input id="newPrice" type="number" placeholder="Price (₹)">
      </div>
      <button class="btn" onclick="addProduct()">Add Item to Store</button>
    </div>
  </div>

  <div class="card">
    <h2>Your Gift Cart</h2>
    <div id="cartItems" style="margin:1rem 0;"></div>
    <p style="font-weight:bold; font-size:1.1rem; margin-bottom:1rem;">Total: ₹<span id="totalAmt">0</span></p>
    <input type="text" id="custNote" placeholder="Gift Card Message (e.g., Happy Birthday!)">
    <input type="date" id="delDate">
    <button class="btn" style="width:100%;" onclick="checkout()">Place Scheduled Order</button>
    <div id="orderStatus" style="margin-top:1rem; font-size:0.9rem; color:#065f46;"></div>
  </div>
</div>
<script>
let catalog = [
  { id: 1, name: "Crimson Rose Bouquet", occ: "Anniversary", price: 799, icon: "🌹" },
  { id: 2, name: "Pastel Lily & Truffle Box", occ: "Birthday", price: 1199, icon: "💐" },
  { id: 3, name: "Artisan Dry Fruit & Candle Hamper", occ: "Festive", price: 1499, icon: "🎁" },
  { id: 4, name: "Sunflower Sunshine Jar", occ: "Birthday", price: 649, icon: "🌻" }
];
let cart = [];

function renderCatalog(items) {
  document.getElementById('prodList').innerHTML = items.map(p => `
    <div class="prod">
      <div class="icon">${p.icon}</div>
      <h4>${p.name}</h4>
      <small style="color:#9f1239;">${p.occ}</small>
      <p style="font-weight:bold; margin:0.5rem 0;">₹${p.price}</p>
      <button class="btn" onclick="addToCart(${p.id})">Add to Cart</button>
    </div>
  `).join('');
}

function filterOcc(occ) {
  renderCatalog(occ === 'All' ? catalog : catalog.filter(p => p.occ === occ));
}

function addToCart(id) {
  const item = catalog.find(p => p.id === id);
  const existing = cart.find(c => c.id === id);
  if(existing) existing.qty++; else cart.push({ ...item, qty: 1 });
  renderCart();
}

function renderCart() {
  let total = 0;
  document.getElementById('cartItems').innerHTML = cart.map((c, idx) => {
    total += c.price * c.qty;
    return `<div class="cart-item"><span>${c.name} x${c.qty}</span><span>₹${c.price*c.qty} <button onclick="removeCart(${idx})" style="border:none;background:none;color:red;cursor:pointer;">✕</button></span></div>`;
  }).join('') || "<p style='color:#888;'>Cart is empty</p>";
  document.getElementById('totalAmt').innerText = total;
}

function removeCart(i) { cart.splice(i, 1); renderCart(); }
function toggleAdmin() { const b = document.getElementById('adminBox'); b.style.display = b.style.display === 'none' ? 'block' : 'none'; }

function addProduct() {
  const name = document.getElementById('newName').value.trim();
  const occ = document.getElementById('newOcc').value;
  const price = parseInt(document.getElementById('newPrice').value);
  if(!name || !price) return;
  catalog.push({ id: Date.now(), name, occ, price, icon: "🎀" });
  renderCatalog(catalog);
}

function checkout() {
  if(!cart.length) return alert("Add a gift first!");
  const d = document.getElementById('delDate').value || "Tomorrow";
  document.getElementById('orderStatus').innerText = `Order Confirmed! Scheduled for ${d}. Message: "${document.getElementById('custNote').value}"`;
  cart = []; renderCart();
}

renderCatalog(catalog); renderCart();
</script>
</body>
</html>
