<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriMart | Farm Supplies & Produce</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
  body { background: #f7fee7; color: #1a2e05; }
  header { background: #3f6212; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
  nav button { background: #4d7c0f; color: #fff; border: none; padding: 0.5rem 0.9rem; border-radius: 6px; cursor: pointer; margin-left: 0.4rem; }
  nav button.active { background: #84cc16; color: #1a2e05; font-weight: bold; }
  .container { max-width: 1050px; margin: 1.5rem auto; padding: 0 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
  .card { background: #fff; padding: 1.2rem; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 1rem; }
  .btn { background: #4d7c0f; color: #fff; border: none; padding: 0.5rem 0.9rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
  input, select { padding: 0.55rem; border: 1px solid #bef264; border-radius: 6px; margin-right: 0.4rem; margin-bottom: 0.5rem; }
  .view { display: none; } .view.active { display: block; }
</style>
</head>
<body>
<header>
  <h1>AgriMart</h1>
  <nav>
    <button class="active" onclick="switchTab('market', this)">Buyer Store (Wallet: ₹<span id="wBal">2500</span>)</button>
    <button onclick="switchTab('farmer', this)">Farmer Seller Hub</button>
  </nav>
</header>
<div class="container">
  <div id="market" class="view active">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
      <div>
        <select id="catSel" onchange="render()"><option value="">All Categories</option><option>Seeds</option><option>Fertilizers</option><option>Equipment</option></select>
      </div>
      <div>
        <strong>Cart Items: <span id="cCount">0</span> (₹<span id="cTotal">0</span>)</strong>
        <button class="btn" onclick="placeOrder()">Checkout via Wallet</button>
      </div>
    </div>
    <div class="grid" id="storeGrid"></div>
  </div>

  <div id="farmer" class="view">
    <div class="card">
      <h2>Farmer Product Listing</h2>
      <input id="pName" placeholder="Product Name (e.g., Hybrid Paddy Seeds)">
      <select id="pCat"><option>Seeds</option><option>Fertilizers</option><option>Equipment</option></select>
      <input id="pPrice" type="number" placeholder="Price (₹)">
      <button class="btn" onclick="addAgriItem()">Publish Product</button>
    </div>
    <div class="card">
      <h3>Incoming Orders & Shipping Status</h3>
      <div id="farmerOrders"></div>
    </div>
  </div>
</div>
<script>
let products = [
  { id: 1, name: "Organic Vermicompost (25kg)", cat: "Fertilizers", price: 450, seller: "Kisan Agro Farm" },
  { id: 2, name: "High-Yield Tomato Seeds", cat: "Seeds", price: 220, seller: "GreenRoots Seeds" },
  { id: 3, name: "Battery Knapsack Sprayer", cat: "Equipment", price: 1850, seller: "AgriTech Tools" }
];
let cart = [];
let orders = [];
let wallet = 2500;

function switchTab(id, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function addCart(id) {
  cart.push(products.find(p => p.id === id));
  render();
}

function placeOrder() {
  const sum = cart.reduce((a, b) => a + b.price, 0);
  if(!sum) return alert("Cart is empty");
  if(wallet < sum) return alert("Insufficient wallet balance");
  wallet -= sum;
  orders.push({ id: "AGR-" + (100 + orders.length), count: cart.length, total: sum, status: "Packed" });
  cart = [];
  render();
  alert("Order placed successfully!");
}

function addAgriItem() {
  const name = document.getElementById('pName').value.trim();
  const cat = document.getElementById('pCat').value;
  const price = parseInt(document.getElementById('pPrice').value);
  if(!name || !price) return;
  products.unshift({ id: Date.now(), name, cat, price, seller: "Verified Farmer" });
  render();
}

function shipOrder(i) { orders[i].status = "Dispatched via Rural Express"; render(); }

function render() {
  document.getElementById('wBal').innerText = wallet;
  document.getElementById('cCount').innerText = cart.length;
  document.getElementById('cTotal').innerText = cart.reduce((a, b) => a + b.price, 0);
  const f = document.getElementById('catSel').value;
  document.getElementById('storeGrid').innerHTML = products
    .filter(p => !f || p.cat === f)
    .map(p => `<div class="card"><small>${p.cat} • ${p.seller}</small><h3>${p.name}</h3><p style="font-weight:bold;margin:0.5rem 0;">₹${p.price}</p><button class="btn" onclick="addCart(${p.id})">Add to Cart</button></div>`).join('');
  document.getElementById('farmerOrders').innerHTML = orders.map((o, i) =>
    `<p style="margin:0.5rem 0;">${o.id} (${o.count} items - ₹${o.total}) — <b>${o.status}</b> <button class="btn" onclick="shipOrder(${i})">Dispatch</button></p>`
  ).join('') || "<p>No orders yet.</p>";
}
render();
</script>
</body>
</html>
